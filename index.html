<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <title>SOC News Center — my-news-data</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container animate-fade-in">
      <header class="header">
        <h1>🏗️ SOC News Center</h1>
        <p>토목 엔지니어링 및 SOC 인프라 주요 뉴스 자동수집 대시보드</p>
      </header>

      <div class="controls-bar">
        <div class="filter-group">
          <select id="dateFilter" class="select-box">
            <option value="today">당일 (24시간)</option>
            <option value="3days" selected>최근 3일</option>
            <option value="1week">최근 1주일</option>
            <option value="1month">최근 1개월</option>
            <option value="all">전체</option>
          </select>
        </div>

        <div class="filter-group">
          <select id="limit" class="select-box">
            <option value="10">10개씩 보기</option>
            <option value="30" selected>30개씩 보기</option>
            <option value="50">50개씩 보기</option>
            <option value="100">100개씩 보기</option>
          </select>
        </div>

        <div class="action-buttons">
          <button type="button" id="btnTelegram" class="btn btn-telegram" title="텔레그램으로 전송">텔레그램</button>
          <button type="button" id="reload" class="btn btn-refresh" title="목록 다시 불러오기">새로고침</button>
        </div>
      </div>

      <p id="status" class="status-line" aria-live="polite">불러오는 중…</p>
      <div id="empty" class="empty-state hidden"><p>해당 조건에 맞는 수집된 뉴스가 없습니다.</p></div>
      <main id="root"></main>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
